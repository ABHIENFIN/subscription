services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      # Pull STRIPE_SECRET_KEY, JWT_SECRET, etc. from the repo's .env
      # (the host file is at subscription/.env — one level up from the compose file).
      - ../.env
    environment:
      # Override the .env DATABASE_URL to point at the docker-internal db host
      # instead of localhost (which would try to reach Postgres on the host).
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/subscriptions
      - REDIS_URL=redis://:@redis:6379
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    command: npm run dev

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscriptions
    ports:
      # Host port 5432 is held by another project; remap to 5433 on the host.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6379 is held by another project; remap to 6380 on the host.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: